# Trains Gare de Lyon — rue Jorge Semprún
# Copier le contenu de deploy/nginx/ dans /etc/nginx/conf.d/ (chargé dans le bloc http {}).
#
# Arborescence attendue :
#   /var/www/rails/public/                     ← contenu de public/
#   /var/www/rails/data/declarations.jsonl     ← créé par nginx (dossier accessible en écriture par nginx)
#   /etc/nginx/conf.d/secrets/sncf_auth.inc    ← clé API SNCF (scripts/set-sncf-key.sh). Absent → mode démo.

# ---------- Cache des réponses SNCF (quota : 5000 requêtes/jour) ----------
proxy_cache_path /var/cache/nginx/rails levels=1:2 keys_zone=rails_sncf:1m max_size=50m inactive=1d use_temp_path=off;

# ---------- Limites de débit ----------
limit_req_zone $binary_remote_addr zone=rails_api:1m  rate=30r/m;
limit_req_zone $binary_remote_addr zone=rails_decl:1m rate=20r/m;

# ---------- Mes trains bruyants : une ligne JSON par marquage ----------
# train = clé encodée URL (type|mode|ligne|numéro), n = 1 bruyant / 0 retrait,
# h = heure de passage (HH:MM), dir = provenance/destination (affichage uniquement)
map "$arg_n:$arg_h:$arg_train:$arg_dir" $rails_decl_ok {
    default 0;
    "~^[01]:([0-9]{2}%3A[0-9]{2})?:[A-Za-z0-9%._~*'()!-]{3,200}:[A-Za-z0-9%._~*'()!-]{0,300}$" 1;
}
log_format rails_decl escape=json '{"t":"$msec","s":"$status","train":"$arg_train","n":"$arg_n","h":"$arg_h","dir":"$arg_dir"}';

server {
    listen 80;
    # server_name rails.example.org;

    root /var/www/rails/public;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # ---------- Relais API SNCF : nginx ajoute la clé, met en cache 60 s ----------
    # Seules ces deux URL sont relayées, et uniquement pour Paris Gare de Lyon.
    location = /sncf/arrivals {
        limit_req zone=rails_api burst=20 nodelay;
        include /etc/nginx/conf.d/secrets/sncf_auth*.inc;
        proxy_pass https://api.sncf.com/v1/coverage/sncf/stop_areas/stop_area:SNCF:87686006/arrivals;
        include /etc/nginx/conf.d/rails-sncf-proxy.inc;
    }
    location = /sncf/departures {
        limit_req zone=rails_api burst=20 nodelay;
        include /etc/nginx/conf.d/secrets/sncf_auth*.inc;
        proxy_pass https://api.sncf.com/v1/coverage/sncf/stop_areas/stop_area:SNCF:87686006/departures;
        include /etc/nginx/conf.d/rails-sncf-proxy.inc;
    }

    # ---------- Mes trains bruyants ----------
    location = /declarer {
        limit_except GET { deny all; }
        limit_req zone=rails_decl burst=10 nodelay;
        access_log /var/www/rails/data/declarations.jsonl rails_decl if=$rails_decl_ok;
        add_header Cache-Control "no-store" always;
        if ($rails_decl_ok = 0) { return 400; }
        return 204;
    }

    location = /declarations.jsonl {
        alias /var/www/rails/data/declarations.jsonl;
        default_type application/x-ndjson;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/x-ndjson;
    }
}
